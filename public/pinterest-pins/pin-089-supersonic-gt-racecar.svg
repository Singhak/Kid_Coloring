    <circle cx="150" cy="90" r="10" fill="#000" />
    <circle cx="280" cy="40" r="18" fill="#000" />
    <circle cx="850" cy="60" r="16" fill="#000" />
    <circle cx="950" cy="110" r="12" fill="#000" />
